<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mystyle.css">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>

<body>
    <body>
        <div class="container mt-3">
            
            <form>
                <div class="row mb-3">
                    <label for="firstName" class="col-form-label col-sm-2">ชื่อ *</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="firstName" placeholder="ชื่อ">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="lastName" class="col-form-label col-sm-2">สกุล</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="lastName" placeholder="สกุล">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="birthDate" class="col-form-label col-sm-2">วัน/เดือน/ปีเกิด</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="birthDate">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="age" class="col-form-label col-sm-2">อายุ</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="age" placeholder="อายุ">
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-form-label col-sm-2">เพศ</label>
                    <div class="col-sm-10">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked>
                            <label class="form-check-label" for="male">ชาย</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                            <label class="form-check-label" for="female">หญิง</label>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="photo" class="col-form-label col-sm-2">รูป</label>
                    <div class="col-sm-10">
                        <input type="file" class="form-control" id="photo">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="address" class="col-form-label col-sm-2">ที่อยู่</label>
                    <div class="col-sm-10">
                        <textarea class="form-control" id="address" rows="3" placeholder="ที่อยู่"></textarea>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="favoriteColor" class="col-form-label col-sm-2">สีที่ชอบ</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="favoriteColor" placeholder="สีที่ชอบ">
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-form-label col-sm-2">เพลงที่ชอบ</label>
                    <div class="col-sm-10">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="music" id="romantic" value="romantic" checked>
                            <label class="form-check-label" for="romantic">เพื่อชีวิต</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="music" id="pop" value="pop">
                            <label class="form-check-label" for="pop">ลูกทุ่ง</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="music" id="other" value="other">
                            <label class="form-check-label" for="other">อื่นๆ</label>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-form-label col-sm-2"></label>
                    
                        <div class="form-check d-flex align-items-center">
                            <input type="checkbox" class="form-check-input me-2" id="consent">
                            <label class="form-check-label" for="consent">ยินยอมให้เก็บข้อมูล</label>
                        </div>
                    
                </div>
                <div class="row mb-3">
                   
                    <div class="col-sm-10 d-flex justify-content-between">
                        <button type="reset" class="btn btn-secondary">Reset</button>
                        <button type="submit" class="btn btn-success">Submit</button>
                    </div>
                </div>
                
            </form>
        </div>
    </body>
</html>
